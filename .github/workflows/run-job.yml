name: Run Cloud Run Job

# Manually trigger a LIVE run of either sync job from the browser
# (repo -> Actions -> Run Cloud Run Job -> Run workflow).
# Needs the same Workload Identity Federation setup as the deploy workflow
# (the two GCP_* repo secrets). See DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: pipe17-airtable-sync
        options:
          - pipe17-airtable-sync
          - hubspot-pipe17-orders
          - pipe17-hubspot-inventory
          - pipe17-parcel-tracking
      args:
        description: "Optional container args override, comma-separated (e.g. main_hubspot_to_pipe17.py,--deal-id,65076828954). Blank = the job's default."
        type: string
        default: ""
      env:
        description: "Optional env override for THIS run only, comma-separated KEY=VALUE (e.g. DRY_RUN=false). Blank = the job's deployed env."
        type: string
        default: ""
      wait:
        description: "Wait for the run to finish (surfaces pass/fail here)"
        type: boolean
        default: true

env:
  GCP_PROJECT: pipe17-b2bops
  GCP_REGION: europe-west1

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute job
        env:
          JOB: ${{ inputs.job }}
          ARGS: ${{ inputs.args }}
          ENVV: ${{ inputs.env }}
          WAIT: ${{ inputs.wait }}
        run: |
          EXTRA=()
          [ -n "$ARGS" ] && EXTRA+=("--args=$ARGS")
          [ -n "$ENVV" ] && EXTRA+=("--update-env-vars=$ENVV")
          [ "$WAIT" = "true" ] && EXTRA+=("--wait")
          gcloud run jobs execute "$JOB" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            "${EXTRA[@]}"

      - name: Dump recent Cloud Run job logs
        if: always()
        env:
          JOB: ${{ inputs.job }}
        run: |
          echo "=== recent logs for $JOB (last 10m) ==="
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\"" \
            --project "$GCP_PROJECT" --limit 150 --freshness=10m \
            --format='value(timestamp,textPayload)' --order=asc || true
